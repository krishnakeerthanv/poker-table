<style>
:root{
  --ink:#0C0D0F;--surface:#131518;--surface2:#1B1E22;--line:#272A2E;--paper:#D6DAD7;--muted:#7A8086;
  --gold:#7FC7A6;--red:#D77870;--green:#5FAE84;--onGold:#0A100D;--redSoft:#E29A8C;--accentEdge:#4E7A62;
  --accentWash:#18261F;--warn:#E5C784;--edge:#5D636B;--depth:#5C6E64;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:16px;line-height:1.4}
body{min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--ink) 80%,transparent);padding:calc(10px + env(safe-area-inset-top)) 0 8px}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:var(--mono);font-weight:700;letter-spacing:.14em;font-size:13px;color:var(--paper);display:flex;align-items:center;gap:8px}
.brand i{width:12px;height:12px;border-radius:50%;border:2.5px solid var(--gold);display:inline-block}
.who{font-size:12.5px;color:var(--muted);text-align:right}
h1{font-family:var(--mono);font-size:22px;letter-spacing:-.02em;margin:18px 0 6px}
h2{font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:24px 0 10px}
p{margin:6px 0 12px}
.muted{color:var(--muted)} .small{font-size:13px} .warnTxt{color:var(--warn)} .bad{color:var(--redSoft)}
.fig{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--green)} .down{color:var(--red)}
.card{background:linear-gradient(#16181C,#101215);border:1px solid var(--line);border-top-color:#2F3338;border-radius:14px;padding:14px;margin:10px 0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 16px;border-radius:12px;border:1px solid var(--accentEdge);background:transparent;color:var(--gold);font-weight:600;font-size:16px;cursor:pointer;width:100%;text-decoration:none;text-align:center}
.btn.solid{background:var(--gold);color:var(--onGold);border-color:var(--gold)}
.btn.ghost{border-color:var(--edge);color:var(--paper)}
.btn.danger{border-color:rgba(215,120,112,.45);color:var(--redSoft)}
.btn:disabled{opacity:.35;cursor:default}
.btn:active:not(:disabled){transform:scale(.98)}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.stack>*+*{margin-top:10px}
.rack{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.rack div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.rack b{display:block;font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums}
.rack span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.seat{background:linear-gradient(#16181C,#101215);border:1px solid var(--line);border-top-color:#2F3338;border-radius:14px;padding:12px;margin:10px 0}
.seat.closed{opacity:.78}
.seatTop{display:flex;align-items:center;gap:10px}
.dot{width:26px;height:26px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:12px;color:#0C0D0F;border:3px dashed rgba(255,255,255,.45)}
.seatName{font-weight:650;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seatIn{font-family:var(--mono);font-size:15px;text-align:right;font-variant-numeric:tabular-nums}
.seatSub{font-size:13px;color:var(--muted);margin:4px 0 10px 36px}
.depth{display:flex;gap:3px;margin:0 0 10px 36px}
.depth i{height:6px;width:18px;border-radius:2px;background:var(--depth)}
.seatBtns{display:grid;grid-template-columns:1.3fr 1fr 1fr 48px;gap:8px}
.seatBtns .btn{min-height:48px;padding:8px 6px;font-size:15px}
.more{font-size:20px;letter-spacing:.05em}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(12,13,15,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.dock .row .btn{min-height:52px}
.undoBar{position:relative;overflow:hidden}
.undoBar .drain{position:absolute;left:0;bottom:0;height:2px;background:var(--gold);width:100%;transform-origin:left;animation:drain 8s linear forwards}
@keyframes drain{to{transform:scaleX(0)}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--edge);border-radius:999px;padding:10px 14px;min-height:44px;background:transparent;cursor:pointer;font-size:15px}
.chip.on{background:var(--accentWash);border-color:var(--gold);color:var(--gold)}
.field{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:13px;font-size:16px;outline:none}
.field:focus{border-color:var(--accentEdge)}
.field.figin{font-family:var(--mono);font-weight:600;text-align:right}
textarea.field{min-height:150px;font-family:var(--mono);font-size:15px}
label.lab{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.seg{display:flex;border:1px solid var(--edge);border-radius:12px;overflow:hidden}
.seg button{flex:1;min-height:46px;background:transparent;border:0;cursor:pointer;font-size:15px}
.seg button.on{background:var(--accentWash);color:var(--gold)}
.seg button+button{border-left:1px solid var(--edge)}
.line{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 4.4 review: the standings table fits a 320-375 px phone; names wrap instead of vanishing */
#stTable .line{gap:6px}#stTable .fig{font-size:13px}#stTable .c-net{font-size:14px}#stTable .nm{white-space:normal;overflow-wrap:anywhere;min-width:64px}
@media (max-width:359px){#stTable .c-avg{display:none}}
.pay{display:flex;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}
.pay:last-child{border-bottom:0}
.pay .arrow{color:var(--muted)}
.pay .amt{margin-left:auto;font-family:var(--mono);font-weight:700;color:var(--gold)}
.countRow{display:grid;grid-template-columns:1fr 130px 76px;gap:8px;align-items:center;padding:6px 0}
.countRow .btn{min-height:46px;font-size:14px;padding:6px}
.status{border-radius:12px;padding:12px;margin:12px 0;font-size:15px;border:1px solid var(--line);background:var(--surface)}
.status.ok{border-color:var(--accentEdge);color:var(--gold)}
.status.warn{border-color:rgba(229,199,132,.45);color:var(--warn)}
.status.err{border-color:rgba(215,120,112,.45);color:var(--redSoft)}
.flag{display:inline-block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--edge);border-radius:6px;padding:3px 7px;margin:2px 4px 2px 0;color:var(--muted)}
.flag.w{color:var(--warn);border-color:rgba(229,199,132,.45)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{font-family:var(--mono);margin:0 0 4px;font-size:18px}
.grab{width:38px;height:5px;border-radius:3px;background:var(--edge);margin:-6px auto 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));background:var(--surface2);border:1px solid var(--edge);border-radius:12px;padding:10px 14px;z-index:30;font-size:14px;max-width:92vw}
.linkbox{font-family:var(--mono);font-size:12px;word-break:break-all;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--muted);max-height:120px;overflow:auto}
.hide{display:none!important}
.big{font-size:28px;font-family:var(--mono);font-weight:700}
ol.how{padding-left:20px;margin:6px 0} ol.how li{margin:6px 0}
a{color:var(--gold)}
/* K4: long names never push figures off a phone screen; sheet fits above the iOS keyboard */
.pay>span:not(.arrow):not(.amt){min-width:0;overflow-wrap:anywhere}.pay .amt{flex:0 0 auto}.countRow{grid-template-columns:minmax(0,1fr) 130px 76px}.countRow .nm{min-width:0;overflow-wrap:anywhere}.who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sheet{max-height:88dvh}
/* 4.1: cloud save status in the header */
/* The dot sits on its own line above "Run by …": the name may be cut short, the status never is. */
.who{display:flex;flex-direction:column;align-items:flex-end;overflow:visible;white-space:normal}
#who{max-width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin:0 0 2px;font-size:12px;color:var(--muted);white-space:nowrap;flex:0 0 auto}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted);flex:0 0 auto}
.sync.live::before{background:var(--green)} .sync.saving::before{background:var(--warn)} .sync.offline::before{background:var(--redSoft)}
/* 4.3: the brand matches the cards; home's "More"; settle-up card */
.brandSub{font-weight:500;letter-spacing:.08em;color:var(--muted);text-transform:lowercase}
details.moreBox{margin:14px 0 0;border:1px solid var(--line);border-radius:12px;padding:0 12px}
details.moreBox summary{cursor:pointer;min-height:46px;display:flex;align-items:center;color:var(--muted);font-size:15px;list-style:none}
details.moreBox summary::-webkit-details-marker{display:none}
details.moreBox summary::after{content:"›";margin-left:auto}
details.moreBox[open]{padding-bottom:12px}
details.moreBox[open] summary::after{content:"⌄"}
#settleToggle{min-height:44px;font-size:15px;font-weight:600}
/* 4.4.1: "You: <name> · In [Change]" never squeezes the text: it wraps, and Change drops below when it can't fit beside */
.youLine{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin-top:10px}
.youLine .youTxt{flex:1 1 11em;min-width:0;overflow-wrap:anywhere}
.youLine .btn{width:auto;flex:0 0 auto;min-height:44px;padding:8px 18px}
</style>

<body>
<header class="top"><div class="wrap"><div class="brand"><i></i><span id="brandName">POKER BANK</span><span class="brandSub">table</span></div><div class="who"><span class="sync hide" id="sync" role="status" aria-live="polite"></span><span id="who"></span></div></div></header>
<main class="wrap" id="app"></main>
<div class="dock hide" id="dock"><div class="wrap" id="dockIn"></div></div>
<div id="layer"></div>
<noscript><div class="wrap"><p>This page needs JavaScript turned on.</p></div></noscript>
<script>
/*CORE-START*/
// Poker Bank web table — money + link core. Ported line-for-line from
// PokerBankCore (GameMath.value, Adjustments.absorbDrift/driftFix/splitGap*,
// Settlement.settle/greedyPairs, Transfer.displayOrder) and ResultLink.swift.
// The node cross-check (tests/crosscheck.js) runs THIS text.
var PB = (function () {
  "use strict";
  var HOST = "https://krishnakeerthanv.github.io/poker-table/";

  function sum(a) { var s = 0; for (var i = 0; i < a.length; i++) s += a[i]; return s; }
  function cmpStr(a, b) { return a < b ? -1 : a > b ? 1 : 0; }

  // GameMath.value — round(chips / ratio), half-up, integers only.
  function value(chips, ratio) {
    var r = Math.max(1, ratio | 0), c = Math.max(0, chips | 0);
    var q = Math.floor(c / r), rem = c - q * r;
    return rem >= r - rem ? q + 1 : q;
  }

  // netThenName: net desc, then name, then id.
  function canonical(a, b) {
    if (a.net !== b.net) return a.net > b.net ? -1 : 1;
    var n = cmpStr(a.name, b.name); if (n) return n;
    return cmpStr(a.id, b.id);
  }
  function firstMaxBy(indices, key) {
    var best = indices[0];
    for (var k = 1; k < indices.length; k++) if (key(best) < key(indices[k])) best = indices[k];
    return best;
  }

  function driftFix(nets) {
    var drift = sum(nets.map(function (p) { return p.net; }));
    if (drift === 0 || !nets.length) return nets;
    var out = nets.map(function (p) { return { id: p.id, name: p.name, net: p.net }; });
    var idx = firstMaxBy(out.map(function (_, i) { return i; }), function (i) { return Math.abs(out[i].net); });
    out[idx].net -= drift;
    return out;
  }

  function absorbDrift(nets, vals, paidEarly) {
    if (nets.length !== vals.length) return { nets: driftFix(nets), vals: vals };
    var drift = sum(nets.map(function (p) { return p.net; }));
    if (drift === 0 || !nets.length) return { nets: nets, vals: vals };
    var all = nets.map(function (_, i) { return i; });
    var eligible = all.filter(function (i) { return vals[i] > 0 && vals[i] - drift >= 0; });
    var early = paidEarly && paidEarly.length === nets.length ? paidEarly : null;
    var preferred = early ? eligible.filter(function (i) { return !early[i]; }) : eligible;
    var pool = preferred.length ? preferred : (eligible.length ? eligible : all);
    var idx = firstMaxBy(pool, function (i) { return Math.abs(nets[i].net); });
    var outNets = nets.map(function (p) { return { id: p.id, name: p.name, net: p.net }; });
    var outVals = vals.slice();
    outNets[idx].net -= drift;
    outVals[idx] = Math.max(0, outVals[idx] - drift);
    return { nets: outNets, vals: outVals };
  }

  function greedyPairs(players) {
    var cr = players.filter(function (p) { return p.net > 0; })
      .map(function (p) { return { id: p.id, name: p.name, net: p.net }; }).sort(canonical);
    var db = players.filter(function (p) { return p.net < 0; })
      .map(function (p) { return { id: p.id, name: p.name, net: -p.net }; }).sort(canonical);
    var out = [], i = 0, j = 0;
    while (i < cr.length && j < db.length) {
      var amt = Math.min(cr[i].net, db[j].net);
      out.push({ fromId: db[j].id, from: db[j].name, toId: cr[i].id, to: cr[i].name, amt: amt });
      cr[i].net -= amt; db[j].net -= amt;
      if (cr[i].net === 0) i++;
      if (db[j].net === 0) j++;
    }
    return out;
  }

  // Settlement.settle — exact minimum transfers via subset DP, canonical order.
  function settle(input) {
    var nets = input.map(function (p) { return { id: p.id, name: p.name, net: p.net }; }).sort(canonical);
    var total = sum(nets.map(function (p) { return p.net; }));
    var balanced = total === 0 ? nets : driftFix(nets);
    var act = balanced.filter(function (p) { return p.net !== 0; });
    if (act.length <= 1) return [];
    if (act.length > 15) return greedyPairs(act);
    var n = act.length, full = (1 << n) - 1;
    var s = new Array(full + 1).fill(0);
    for (var mask = 1; mask <= full; mask++) {
      var low = mask & -mask;
      s[mask] = s[mask ^ low] + act[31 - Math.clz32(low)].net;
    }
    var best = new Array(full + 1).fill(-1), pick = new Array(full + 1).fill(0);
    best[0] = 0;
    for (mask = 1; mask <= full; mask++) {
      low = mask & -mask;
      var t = mask;
      while (t > 0) {
        if ((t & low) !== 0 && s[t] === 0 && best[mask ^ t] >= 0 && best[mask ^ t] + 1 > best[mask]) {
          best[mask] = best[mask ^ t] + 1; pick[mask] = t;
        }
        t = (t - 1) & mask;
      }
    }
    var out = [];
    mask = full;
    while (mask > 0) {
      var group = pick[mask], members = [];
      for (var k = 0; k < n; k++) if (group & (1 << k)) members.push(act[k]);
      out = out.concat(greedyPairs(members));
      mask ^= group;
    }
    return out;
  }

  function displayOrder(a, b) {
    if (a.amt !== b.amt) return a.amt > b.amt ? -1 : 1;
    return cmpStr(a.from, b.from) || cmpStr(a.to, b.to) || cmpStr(a.fromId, b.fromId) || cmpStr(a.toId, b.toId);
  }

  // Adjustments.splitGap / splitGapNonNegative.
  function splitGap(stacks, shouldBe) {
    if (!stacks.length) return { adjusted: stacks, record: null };
    var gap = sum(stacks) - shouldBe;
    if (gap === 0) return { adjusted: stacks.slice(), record: null };
    var n = stacks.length, target = -gap;
    var base = Math.trunc(target / n), rem = target - base * n;
    var adj = stacks.map(function (x) { return x + base; });
    var step = rem >= 0 ? 1 : -1;
    for (var k = 0; k < Math.abs(rem); k++) adj[k] += step;
    return { adjusted: adj, record: { chips: gap, split: n } };
  }
  function splitGapNonNegative(stacks, shouldBe) {
    var r = splitGap(stacks, shouldBe);
    if (!r.adjusted.some(function (x) { return x < 0; })) return r;
    var out = r.adjusted.slice(), deficit = 0;
    for (var i = 0; i < out.length; i++) if (out[i] < 0) { deficit -= out[i]; out[i] = 0; }
    while (deficit > 0) {
      var cand = out.map(function (_, i) { return i; }).filter(function (i) { return out[i] > 0; })
        .sort(function (a, b) { return out[b] - out[a] || a - b; });
      if (!cand.length) break;
      var share = Math.max(1, Math.floor(deficit / cand.length));
      for (var c = 0; c < cand.length; c++) {
        if (deficit <= 0) break;
        var take = Math.min(Math.min(share, out[cand[c]]), deficit);
        out[cand[c]] -= take; deficit -= take;
      }
    }
    return { adjusted: out, record: r.record };
  }

  // BankStore.settleFinalCount for a count of every still-open stack:
  // the gap is spread only over open stacks holding chips (all open ones if
  // none hold any); stacks cashed out earlier never move.
  function finalCount(openChips, shouldBe) {
    var idx = openChips.map(function (_, i) { return i; });
    var holders = idx.filter(function (i) { return openChips[i] > 0; });
    var over = holders.length ? holders : idx;
    var outside = sum(openChips) - sum(over.map(function (i) { return openChips[i]; }));
    var r = splitGapNonNegative(over.map(function (i) { return openChips[i]; }), shouldBe - outside);
    var adjusted = openChips.slice();
    over.forEach(function (i, k) { adjusted[i] = r.adjusted[k]; });
    var ok = adjusted.every(function (x) { return x >= 0; }) && sum(adjusted) === shouldBe;
    return { ok: ok, adjusted: adjusted, record: r.record };
  }

  // A finished night from seats {n, in, c, e} — exactly ImportedNight.build.
  function computeNight(seats, ratio) {
    var vals = seats.map(function (s) { return value(s.c, ratio); });
    var nets = seats.map(function (s, k) { return { id: s.id || s.n, name: s.n, net: vals[k] - s.in }; });
    var raw = sum(nets.map(function (p) { return p.net; }));
    var fixed = absorbDrift(nets, vals, seats.map(function (s) { return !!s.e; }));
    var rows = seats.map(function (s, k) {
      return { n: s.n, idx: k, in: s.in, c: s.c, val: fixed.vals[k], net: fixed.nets[k].net };
    }).sort(function (a, b) { return canonical({ net: a.net, name: a.n, id: seats[a.idx].id || a.n }, { net: b.net, name: b.n, id: seats[b.idx].id || b.n }); });
    var transfers = settle(fixed.nets).sort(displayOrder);
    return { rows: rows, transfers: transfers, rounded: roundTransfers(transfers, rows), rawDrift: raw };
  }

  // B10 (4.3): who pays whom, rounded to the nearest ₹50. Nets stay exact.
  // The app's core runs exactly these steps (vectors: expect.rounded):
  //  1. Start from the exact plan (the transfers above, in display order) and
  //     round every amount to the nearest 50, half up (25 → 50, 75 → 100).
  //  2. The transfers link players into groups (trees). In each group the
  //     anchor is its biggest winner: the member that comes first in the
  //     rows (net desc, then name, then id).
  //  3. Walk each group breadth-first from the anchor, taking a player's
  //     transfers in plan order; a player's "link" is the transfer through
  //     which it was reached. Then, in reverse walk order (farthest first),
  //     for every player P but the anchor: e = P's rounded balance
  //     (received − paid) − P's exact net; r = e mod 50 (0..49). Keep the
  //     group's running residue S (starts at 0): P keeps error r if
  //     S + r ≤ 25, else r − 50; S += that error. P's link moves by the
  //     rest (a multiple of 50) so P's balance lands on net + its error. A
  //     link that goes below ₹0 turns round (payer and payee swap).
  //  4. The anchor takes the group's residue (−S, never more than ₹25).
  //     Every player ends within ₹50 of their net. Transfers at ₹0 are

  // ----- setup -----

        '<p class="small muted" style="margin:6px 0 0">Started ' + fmtTime(G.d) + (G.h ? " · taken over from a hand-over link" : "") + " · " + (G.ratio === 1 ? "₹1 = 1 chip" : "₹1 = " + G.ratio + " chips") + "</p>" +
        seats +
        '<div class="stack" style="margin-top:14px">' + (GK && G.cid && !G.told ? '<button class="btn" id="tellBtn">Tell the group</button>' : "") + '<button class="btn ghost" id="addP">+ Add a player</button><button class="btn ghost" id="home" style="min-height:44px;font-size:14px">Menu</button></div>';

  function seatAction(act, k) {
    var s = G.seats[k];
    if (act === "buy") return commit(s.n + " bought in " + PB.inr(G.unit), function () { s.b.push(G.unit); });
    if (act === "bust") return confirmSheet(s.n + " busted?", "No chips left. " + s.n + " is out at " + PB.signed(-totalIn(s)) + ". You can reopen it later.", "Busted", true, function () {
      commit(s.n + " busted", function () { s.c = 0; s.at = now(); s.e = 1; });
    });
    if (act === "reopen") {
      // Her chips are in front of the player who took her seat: reopening
      // her would put them on the table twice.
      var ho = handOverOf(s);
      if (ho) return toast(s.n + " handed the seat to " + ho.t + ". Those chips are " + ho.t + "'s now.");
      return commit(s.n + " is back in", function () { s.c = null; s.at = null; s.e = 0; });
    }
    if (act === "cash") return cashOut(k);
    if (act === "more") return moreSheet(k);
  }

  function cashOut(k) {
    var s = G.seats[k], max = onTable();
    sheet("<h3>Cash out " + esc(s.n) + '</h3><p class="muted small">Count ' + esc(s.n) + "'s chips. Multiples of 50. Up to " + PB.grouped(max) + ' chips are on the table.</p><input class="field figin" id="ch" inputmode="numeric" pattern="[0-9]*" placeholder="Chips"><div class="status" id="worth">' + esc(s.n) + " put in " + PB.inr(totalIn(s)) + '.</div><div class="stack"><button class="btn solid" id="ok">Cash out</button><button class="btn ghost" id="no">Cancel</button></div>', function (el) {
      var f = el.querySelector("#ch"), w = el.querySelector("#worth");
      function check() {
        var c = parseChips(f.value);
        if (f.value.trim() === "") { w.className = "status"; w.textContent = s.n + " put in " + PB.inr(totalIn(s)) + "."; return null; }
        if (c == null) { w.className = "status err"; w.textContent = "Digits only."; return null; }
        if (c % 50) { w.className = "status err"; w.textContent = "Chips must be a multiple of 50."; return null; }
        if (c > max) { w.className = "status err"; w.textContent = "Only " + PB.grouped(max) + " chips are on the table. Recount."; return null; }
        var val = PB.value(c, G.ratio), net = val - totalIn(s);
        w.className = "status ok"; w.textContent = PB.grouped(c) + " chips = " + PB.inr(val) + " · " + PB.signed(net);
        return c;
      }
      f.oninput = check;
      el.querySelector("#no").onclick = closeSheet;
      el.querySelector("#ok").onclick = function () {
        var c = check(); if (c == null) { f.focus(); return; }
        closeSheet();
        commit(s.n + " cashed out " + PB.signed(PB.value(c, G.ratio) - totalIn(s)), function () { s.c = c; s.at = now(); s.e = 1; });
      };
    });
  }

  function moreSheet(k) {
    var s = G.seats[k], last = s.b[s.b.length - 1];
    var canDropLast = s.c == null && s.b.length > 1 && onTable() >= last * G.ratio;
    var canRemove = s.c == null && s.b.length === 1 && onTable() >= last * G.ratio && !inHandover(s);
    sheet("<h3>" + esc(s.n) + '</h3><p class="muted small">Buy-ins: ' + s.b.map(PB.inr).join(" + ") + " = " + PB.inr(totalIn(s)) + "</p>" +
      (s.c == null ? '<label class="lab">Different amount buy-in</label><div class="row"><input class="field figin" id="amt" inputmode="numeric" pattern="[0-9]*" placeholder="₹"><button class="btn solid" id="addAmt" style="flex:0 0 110px">Buy in</button></div>' : "") +
      '<label class="lab">Name</label><div class="row"><input class="field" id="nm" maxlength="24" value="' + esc(s.n) + '"><button class="btn" id="ren" style="flex:0 0 110px">Rename</button></div>' +
      '<div class="stack" style="margin-top:16px">' +
      (s.b.length > 1 ? '<button class="btn danger" id="dropLast"' + (canDropLast ? "" : " disabled") + ">Remove last buy-in (" + PB.inr(last) + ")</button>" : "") +
      '<button class="btn danger" id="rm"' + (canRemove ? "" : " disabled") + ">Remove from tonight</button>" +
      '<p class="small muted">' + (s.c != null ? "Reopen the stack first to change money." : "Removing is only for someone seated by mistake (one buy-in, chips handed back).") + '</p><button class="btn ghost" id="no">Close</button></div><p class="bad small" id="err"></p>', function (el) {

      el.querySelector("#rm").onclick = function () { closeSheet(); commit("Removed " + s.n, function () { G.seats.splice(k, 1); }); };
    });
  }

  function addPlayer() {

    sheet('<h3>Add a player</h3><p class="muted small">Starts with one ' + PB.inr(G.unit) + ' buy-in.</p>' +
      (free.length ? '<div class="chips">' + free.map(function (r) { return '<button class="chip" data-n="' + esc(r.n) + '">' + esc(r.n) + "</button>"; }).join("") + "</div>" : "") +
      '<div class="row" style="margin-top:12px"><input class="field" id="nm" maxlength="24" placeholder="Type a new name"><button class="btn solid" id="ok" style="flex:0 0 90px">Seat</button></div><p class="bad small" id="err"></p>', function (el) {
      function seat(n) {

  // ----- final count -----
  var countDraft = (function () { var d = load(COUNT, {}); return d && typeof d === "object" && !Array.isArray(d) ? d : {}; })();
  VIEWS.count = {
    html: function () {
      var open = G.seats.map(function (s, k) { return [s, k]; }).filter(function (x) { return x[0].c == null; });
      var should = onTable();
      var rows = open.map(function (x) {
        var s = x[0], k = x[1], dk = s.n.toLowerCase(), v = typeof countDraft[dk] === "string" ? countDraft[dk] : "";
        return '<div class="countRow"><div class="nm" style="font-weight:600">' + esc(s.n) + '<div class="small muted">in ' + PB.inr(totalIn(s)) + '</div></div><input class="field figin" data-k="' + k + '" inputmode="numeric" pattern="[0-9]*" placeholder="Chips" value="' + esc(v) + '"><button class="btn danger" data-zero="' + k + '">Busted</button></div>';
      }).join("");
      return '<h1>Final count</h1><p class="muted small">Go round the table. The stacks have to add up to the <b class="fig">' + PB.grouped(should) + "</b> chips still on the table. Multiples of 50.</p>" +
        '<div class="card">' + rows + '</div><div class="status" id="sum"></div>' +
        '<div class="stack"><button class="btn solid" id="settle" disabled>Settle</button><button class="btn hide" id="split">Split it and settle</button><button class="btn ghost" id="back">Back to the table</button></div>';
    },
    bind: function () {
      var inputs = app.querySelectorAll("input[data-k]"), sumEl = document.getElementById("sum");
      var settleBtn = document.getElementById("settle"), splitBtn = document.getElementById("split");
      function state() {
        var vals = [], bad = null, missing = 0;
        inputs.forEach(function (f) {
          countDraft[G.seats[+f.dataset.k].n.toLowerCase()] = f.value;
          var t = f.value.trim();
          if (t === "") { missing++; vals.push(null); return; }
          var c = parseChips(t);
          if (c == null || c % 50 || c > MAXCHIPS) bad = bad || G.seats[+f.dataset.k].n;
          vals.push(c);
        });
        save(COUNT, countDraft);
        var should = onTable(), got = PB.sum(vals.filter(function (x) { return x != null; }));
        settleBtn.disabled = true; splitBtn.classList.add("hide");
        if (bad) { sumEl.className = "status err"; sumEl.textContent = bad + "'s chips must be a whole multiple of 50 (at most " + PB.grouped(MAXCHIPS) + ")."; return null; }
        var diff = got - should;
        if (missing) { sumEl.className = "status"; sumEl.innerHTML = '<span class="fig">' + PB.grouped(got) + " of " + PB.grouped(should) + "</span> counted · " + missing + " to go"; return null; }
        if (diff === 0) { sumEl.className = "status ok"; sumEl.textContent = "Balanced — " + PB.grouped(got) + " chips. Ready to settle."; settleBtn.disabled = false; return vals; }
        sumEl.className = "status warn";
        sumEl.innerHTML = (diff < 0 ? "Short by " : "Extra ") + '<b class="fig">' + PB.grouped(Math.abs(diff)) + "</b> chips (" + PB.grouped(got) + " counted, " + PB.grouped(should) + " on the table). Recount, or split the difference across the stacks that hold chips — the split is shown on the result.";
        splitBtn.classList.remove("hide");
        return vals;
      }
      inputs.forEach(function (f) { f.oninput = state; });
      app.querySelectorAll("[data-zero]").forEach(function (b) { b.onclick = function () { var f = app.querySelector('input[data-k="' + b.dataset.zero + '"]'); f.value = "0"; state(); }; });
      document.getElementById("back").onclick = function () { go("table"); };
      function apply(vals, allowSplit) {
        var ks = []; inputs.forEach(function (f) { ks.push(+f.dataset.k); });
        var r = PB.finalCount(vals, onTable());
        if (!r.ok) { sumEl.className = "status err"; sumEl.textContent = "That count can't be balanced without a negative stack. Recount the table."; return; }
        if (r.record && !allowSplit) return;
        var t = now();
        commit(null, function () {
          ks.forEach(function (k, j) { G.seats[k].c = r.adjusted[j]; G.seats[k].at = t; G.seats[k].e = 0; });
          G.gap = r.record ? [r.record.chips, r.record.split] : null;
          finish(t);
        });
        countDraft = {}; drop(COUNT);
        go("result");

    var ks = movable.filter(function (k) { return (G.seats[k].at || 0) === latest; });
    var names2 = ks.map(function (k) { return G.seats[k].n; }).join(", ");

  // ----- watch (read-only, live) -----
  function watchSeats(g) {
    var ratio = g.ratio, hands = (g.x || []).filter(function (h) {
      var f = g.seats.find(function (s) { return s.n.toLowerCase() === h.f.toLowerCase(); }), t = g.seats.find(function (s) { return s.n.toLowerCase() === h.t.toLowerCase(); });
      return f && t && f !== t && f.c != null;
    });
    var issuedC = PB.sum(g.seats.map(function (s) { return PB.sum(s.b) * ratio; }));
    var countedC = PB.sum(g.seats.map(function (s) { return s.c == null ? 0 : s.c; }));
    var cash = PB.sum(g.seats.map(function (s) { return PB.sum(s.b); })) - PB.sum(hands.map(function (h) { return Math.floor(h.c / ratio); }));
    return { onTable: issuedC - countedC, cash: cash, open: g.seats.filter(function (s) { return s.c == null; }).length };
  }

  // ----- 4.4: the stats explorer (standings v2) and the Friday page -----

  var stand = { s: undefined, gk: null, busy: false, again: false };
  function loadStand() {
    if (!GK) return;
    if (stand.gk !== GK) { stand.gk = GK; stand.s = undefined; }
    if (stand.busy) { stand.again = true; return; }
    stand.busy = true;
    var gk = GK;
    PB.cloud.get("g/" + gk + "/standings").then(function (r) {
      stand.busy = false;
      if (gk !== GK) return;
      stand.s = r.ok ? PB.stats.parse(r.data) : r.denied ? null : (stand.s && stand.s !== "off" ? stand.s : "off");
      if (stand.again) { stand.again = false; return loadStand(); }
      if (view.name === "friday" || view.name === "stats") render();
    });
  }
  function newEx() { return { tab: "season", sort: "net", sub: null, more: 10, a: "", b: "" }; }
  function pct(x) { return Math.round(x * 100) + "%"; }
  function figCls(v) { return v > 0 ? "up" : v < 0 ? "down" : "muted"; }
  function pname(S, id) { return S.players[id] ? S.players[id].n : "?"; }
  function pdot(S, id, k) { var p = S.players[id] || {}; return colorOf({ col: p.col }, k | 0); }
  function sparkSVG(run) {
    if (!run.length) return "";
    var pts = run.length === 1 ? [0, run[0]] : [0].concat(run), W = 300, H = 64, P = 4;
    var lo = Math.min(0, Math.min.apply(null, pts)), hi = Math.max(0, Math.max.apply(null, pts)), span = hi - lo || 1;
    function x(i) { return (P + i * (W - 2 * P) / (pts.length - 1)).toFixed(1); }
    function y(v) { return (P + (hi - v) * (H - 2 * P) / span).toFixed(1); }
    var line = pts.map(function (v, i) { return x(i) + "," + y(v); }).join(" "), end = run[run.length - 1];
    return '<svg id="spark" viewBox="0 0 ' + W + " " + H + '" width="100%" height="' + H + '" role="img" aria-label="Running total" style="display:block;margin:8px 0">' +
      '<line x1="' + P + '" x2="' + (W - P) + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke="#272A2E" stroke-width="1"/>' +
      '<polyline fill="none" stroke="' + (end >= 0 ? "var(--green)" : "var(--redSoft)") + '" stroke-width="2" stroke-linejoin="round" points="' + line + '"/></svg>';
  }
  function kv(k, label, value, cls) {

      var card = !club.loaded ? '<div class="card" id="rsvpCard"><p class="muted">Loading the Friday card…</p></div>'
        : rsvpOpen() ? rsvpCardHTML(true)
        : '<div class="card" id="rsvpCard"><div style="font-weight:650">No Friday card is open right now.</div><div class="small muted quip" id="rsvpQuip" style="margin-top:4px;font-style:italic">' + esc(quip(RSVP_LINES, isoDay(now()))) + "</div></div>";
      return '<h1>Friday</h1>' + card + exHTML();
    },
    bind: function () {
      ["rsvpGo", "rsvpChange"].forEach(function (idA) { var b = document.getElementById(idA); if (b) b.onclick = function () { var y = rsvpOpen(); if (y) rsvpAsk(y); }; });
      exBind();
    }
  };

  // ----- this game moved to another phone (read-only) -----
  VIEWS.lost = {
    html: function () {
      if (!G || !G.lost) return VIEWS.home.html();
      var by = esc(G.lost.by);
      return "<h1>This game moved to " + by + "'s phone</h1>" +
        '<div class="status warn">Someone tapped Continue on another phone, so that phone runs the table now. This phone has stopped saving and won\'t change anything.</div>' +
        '<p class="muted small">Your copy stays on this phone: ' + G.seats.length + " players, " + PB.inr(cashIn()) + " in. If you made changes here that " + by + "'s phone doesn't have, share your copy so they can check.</p>" +
        '<div class="stack" style="margin-top:16px">' + (GK && G.cid ? '<button class="btn solid" id="watch">Watch instead</button>' : "") +
        // A finished copy holds the final count: a hand-over link would show
        // it to whoever opens it (Kittu's 19-Nov rule). It goes to Kittu only.
        (G.phase === "done" ? '<button class="btn" id="kittuCopy">Send my copy to Kittu</button>' : '<button class="btn" id="hand">Share my copy as a hand-over link</button>') +
        '<button class="btn ghost" id="home">Menu</button></div>';
    },
    bind: function () {
      if (!G || !G.lost) return VIEWS.home.bind();
      var wb = document.getElementById("watch"); if (wb) wb.onclick = function () { location.hash = PB.cloud.validId(G.wt) ? "v=" + G.wt : "w=" + GK + "." + G.cid; };
      var hb = document.getElementById("hand"); if (hb) hb.onclick = handOver;
      var kc = document.getElementById("kittuCopy");
      if (kc) {
        // Encoded before the tap: no await between the tap and the share (iOS).
        var pre = null, g = G; PB.encodeJSON(resultPayload().payload).then(function (c) { pre = c; }, function () {});
        kc.onclick = async function () {
          var c = pre || await PB.encodeJSON(resultPayload().payload);
          if (G === g) share(kittuHead(), PB.HOST + "#r=" + c);
        };
      }
      document.getElementById("home").onclick = function () { go("home"); };
    }
  };

  function validHandOff(p) {
    if (!p || p.k !== "h" || p.v !== 1 || !Array.isArray(p.p) || !Number.isInteger(p.r) || !(p.r >= 1 && p.r <= 1000) ||
        !Number.isInteger(p.u) || !(p.u >= 1 && p.u <= 1e7) || !Number.isFinite(p.d) || p.d <= 0) return false;
    if (p.p.length > MAXSEATS) return false;
    var seen = Object.create(null);
    return p.p.every(function (s) {
      if (!s || typeof s.n !== "string") return false;
      var k = s.n.trim().toLowerCase();
      if (!k || seen[k] || k.length > 40) return false; seen[k] = 1;
      return Array.isArray(s.b) && s.b.length && s.b.every(function (a) { return Number.isInteger(a) && a > 0 && a <= 1e7; }) &&
        (s.c == null || (Number.isInteger(s.c) && s.c >= 0 && s.c <= 1e7));
    });
  }
  // Roster names from a link: strings only, the app's 40-character limit.
  function okRoster(r) { return r && typeof r.n === "string" && r.n.trim() && r.n.length <= 40; }
  function cleanRoster(list) {
    return Array.isArray(list) ? list.filter(okRoster).map(function (r) { return { n: r.n, i: typeof r.i === "string" ? r.i : null, col: Number.isInteger(r.col) ? r.col : null }; }) : [];
  }
  function validResult(p) {
    return p && p.k === "r" && p.v === 1 && Array.isArray(p.p) && p.p.length && p.p.length <= MAXSEATS && Number.isInteger(p.r) && p.r >= 1 && p.r <= 1000 && Number.isFinite(p.d) &&
      p.p.every(function (s) { return s && typeof s.n === "string" && s.n.trim() && Number.isInteger(s.in) && s.in >= 0 && Number.isInteger(s.c) && s.c >= 0; });
  }

  function joinGroup(code, ask) {
    clearHash();
    if (!PB.cloud.validGk(code)) {
      toast("That group link is damaged. Open the pinned link again.");
      // 4.4 review: a damaged Friday link still never lands on the runner home.
      return ask ? openFriday() : go("home");
    }
    var was = GK;
    GK = code; save(GKEY, GK); live.at = 0; live.list = [];
    loadRoster(); clubOpen(); cloudKick(0);
    if (was !== GK) toast("Connected to the group");
    // B9/4.4: the RSVP share link (#j=<gk>&a=1) opens the Friday page, and
    // the answer sheet over it while this phone hasn't answered the card.
    if (ask) {
      // The key leaves the address bar; "#friday" keeps a reload on this page.
      try { history.replaceState(null, "", location.pathname + location.search + "#friday"); } catch (e) {}
      club.ask = true; go("friday", { ex: newEx() }); loadStand(); askNow(); return;
    }
    club.ask = false;
    go("home");
  }
  function askNow() {
    if (!club.ask || !club.loaded || view.name !== "friday") return;
    club.ask = false;
    var x = rsvpOpen();
    if (!x) return;
    var me = load(ME, ""), a = me && rsvpKey(me) ? rsvpAnswers(x.c).filter(function (r) { return r.pk === rsvpKey(me); })[0] : null;
    if (!a) rsvpAsk(x);
  }
  async function route(kind, code, ask) {
    if (kind === "j") return joinGroup(code, ask);
    if (kind === "w") return openWatch(code);
    if (kind === "v") return openWatchToken(code);
    if (kind === "s") return go("landingS", PB.cloud.validCode(code) ? { code: code } : { error: "This link is damaged — part of it is missing or was changed. Ask for it to be shared again (copy the whole link)." });
    try {
      var p = await PB.decodeJSON(code);
      if (kind === "r") { if (!validResult(p)) throw new Error("This link opens, but what is inside is not a poker result."); go("landingR", { payload: p, code: code }); }
      else if (kind === "h") { if (!validHandOff(p)) throw new Error("This link opens, but what is inside is not a poker table."); go("landingH", { payload: p, code: code }); }
    } catch (e) {
      go(kind === "h" ? "landingH" : "landingR", { error: e.message || "This link is damaged." });
    }
  }

  // B7: the old #g= roster link is gone (the roster comes from the group;
  // the built-in REGULARS are the offline seed).
  function start() {
    var m = (location.hash || "").match(/^#([hrjwsv])=([A-Za-z0-9_.-]+)(&a=1)?/);
    if (m) route(m[1], m[2], !!m[3]);
    // 4.4 review: #friday never falls back to the runner home, even when
    // this phone lost its group (Safari clears a site's storage after a
    // week unvisited): the Friday page then says how to get back.
    else if (location.hash === "#friday") openFriday();
    else render();
  }
  window.addEventListener("hashchange", start);
  window.addEventListener("storage", function (e) { if (e.key === KEY || e.key === null) resync(); });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) return cloudFlush();
    resync(); checkOwner();
    if (cloudOn() && sync.st !== "live") cloudKick(0);
    if (GK && view.name === "home") loadLive();
  });
  // Locked screen or closed tab: one last save that outlives the page.
  window.addEventListener("pagehide", cloudFlush);
  window.addEventListener("online", function () { if (cloudOn()) cloudKick(0); });
  window.addEventListener("pageshow", function (e) { if (e.persisted) resync(); });
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
  if (GK) { loadRoster(); clubOpen(); if (cloudOn() && G.phase !== "done") cloudKick(1500); }
  // A11: home re-reads what is live every 30 s, only while on screen.
  setInterval(function () { if (GK && view.name === "home" && !document.hidden) loadLive(); }, LIVEMS);
  // A13: ask the browser not to evict this phone's game under storage pressure.
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {}); } catch (e) {}
  start();
})();
</script>
</body>
</html>
